# Inactive release definition. Select exact image IDs/digests at acceptance.
# Project name must remain jarvis; no build or implicit tag selection.
name: jarvis
services:
  jarvis-mcp:
    image: ${JARVIS_MCP_IMAGE:?exact accepted MCP image required}
    pull_policy: never
    container_name: jarvis-mcp
    restart: unless-stopped
    env_file:
      - /etc/jarvis/mcp/runtime.env
    user: '1000:1000'
    environment:
      JARVIS_NOTES_REPOSITORY: /srv/notes/repo.git
      JARVIS_NOTES_BASELINE: /srv/notes/baseline
      JARVIS_NOTES_REVIEW: /srv/notes/review
      JARVIS_NOTES_BASELINE_REF: ${JARVIS_NOTES_BASELINE_REF:-main}
      JARVIS_DRAFT_ROOT: Jarvis Drafts
      JARVIS_SECOND_BRAIN_ROOT: Jarvis Second Brain
      JARVIS_AUDIT_PATH: /srv/jarvis/audit/note-actions.jsonl
      JARVIS_NOTES_MAX_RESULTS: ${JARVIS_NOTES_MAX_RESULTS:-100}
      JARVIS_NOTES_MAX_CONTENT_BYTES: ${JARVIS_NOTES_MAX_CONTENT_BYTES:-100000}
    networks:
      - jarvis-net
    volumes:
      - type: bind
        source: /srv/notes/repo.git
        target: /srv/notes/repo.git
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/notes/baseline
        target: /srv/notes/baseline
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: /srv/notes/review
        target: /srv/notes/review
        bind: {create_host_path: false}
      - type: bind
        source: /srv/jarvis/audit
        target: /srv/jarvis/audit
        bind: {create_host_path: false}
  linear-action-mcp:
    image: ${JARVIS_LINEAR_IMAGE:?exact accepted Linear image required}
    pull_policy: never
    container_name: linear-action-mcp
    restart: unless-stopped
    user: '1000:1000'
    environment:
      JARVIS_MCP_PROFILE: linear-actions
      MCP_TRANSPORT: streamable-http
      MCP_HOST: 0.0.0.0
      MCP_PORT: 8000
      MCP_MOUNT_PATH: /
      MCP_STREAMABLE_HTTP_PATH: /mcp
      MCP_SERVER_NAME: jarvis-linear-actions
      LINEAR_GATEWAY_URL: http://n8n:5678/webhook/linear-action-gateway
      LINEAR_GATEWAY_SECRET_FILE: /run/secrets/n8n_bridge_secret
      LINEAR_GATEWAY_TIMEOUT_SECONDS: 20
    networks:
      - jarvis-net
    volumes:
      - type: bind
        source: /etc/jarvis/linear/n8n_bridge_secret
        target: /run/secrets/n8n_bridge_secret
        read_only: true
        bind: {create_host_path: false}
networks:
  jarvis-net:
    external: true
