services:
  jarvis-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jarvis-api
    restart: unless-stopped
    ports:
      - "8001:8000"
    env_file:
      - .env.docker
    volumes:
      - /mnt/nas/engineering_vault:/mnt/nas/engineering_vault:ro

  n8n:
    image: docker.n8n.io/n8nio/n8n
    container_name: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: 192.168.0.200
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      WEBHOOK_URL: http://192.168.0.200:5678/
      N8N_EDITOR_BASE_URL: http://192.168.0.200:5678/
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - jarvis-api

volumes:
  n8n_data:
    external: true
